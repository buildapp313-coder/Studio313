<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Hub | Studio313</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* --- Aapka Purana VIP Glassmorphism Design Wapis --- */
        .chat-container {
            display: flex;
            max-width: 1400px;
            margin: 20px auto 60px;
            height: 75vh;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            z-index: 10;
            background: rgba(10, 10, 15, 0.7);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        /* 1. Left Sidebar (Channels) */
        .chat-sidebar {
            width: 250px;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.4);
        }

        .section-title {
            font-size: 0.75rem; color: #6b7280; text-transform: uppercase; 
            letter-spacing: 1.5px; margin-bottom: 15px; font-weight: 600;
        }

        .channel-list { list-style: none; padding: 0; margin-bottom: 30px; }
        .channel-item {
            padding: 10px 15px; margin-bottom: 5px; border-radius: 8px; cursor: pointer;
            color: #9ca3af; font-size: 0.9rem; font-weight: 500; transition: all 0.2s;
        }
        .channel-item:hover { color: #ffffff; background: rgba(255, 255, 255, 0.03); }
        .channel-item.active { color: #ffffff; background: rgba(255, 255, 255, 0.08); border-left: 3px solid var(--shape3); }

        /* 2. Center Chat Area */
        .chat-main {
            flex: 1; display: flex; flex-direction: column; position: relative;
        }

        .chat-header {
            padding: 15px 25px; border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex; justify-content: space-between; align-items: center; background: rgba(0, 0, 0, 0.2);
        }

        .chat-messages {
            flex: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px;
        }

        .message { display: flex; gap: 15px; max-width: 85%; }
        .message.own { align-self: flex-end; flex-direction: row-reverse; }
        
        .avatar {
            width: 40px; height: 40px; border-radius: 10px; background: rgba(255, 255, 255, 0.1); 
            border: 1px solid rgba(255, 255, 255, 0.1); display: flex; align-items: center; 
            justify-content: center; font-weight: 600; font-size: 0.9rem; color: #ffffff; cursor: pointer;
        }

        .msg-content {
            background: rgba(255, 255, 255, 0.03); padding: 12px 18px; border-radius: 0 15px 15px 15px;
            border: 1px solid rgba(255, 255, 255, 0.05); color: #d1d5db; font-size: 0.9rem;
        }
        .message.own .msg-content {
            background: rgba(var(--shape3-rgb, 6, 182, 212), 0.08);
            border-color: rgba(var(--shape3-rgb, 6, 182, 212), 0.2); border-radius: 15px 0 15px 15px;
        }

        .role-badge {
            font-size: 0.6rem; padding: 2px 6px; border-radius: 4px; margin-left: 8px; font-weight: 700; text-transform: uppercase;
        }
        .badge-dev { background: rgba(251, 191, 36, 0.2); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.3); }

        .chat-input-area {
            padding: 15px 25px; border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex; gap: 15px; background: rgba(0, 0, 0, 0.3); align-items: center;
        }
        .chat-input {
            flex: 1; padding: 12px 20px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.5); color: #ffffff; outline: none; font-family: 'Poppins', sans-serif;
        }

        /* 3. Right Sidebar (Yahoo Style Online Users) */
        .online-sidebar {
            width: 250px; border-left: 1px solid rgba(255, 255, 255, 0.05);
            padding: 25px 20px; display: flex; flex-direction: column; background: rgba(0, 0, 0, 0.4);
        }

        .online-user-item {
            display: flex; align-items: center; gap: 10px; padding: 8px 10px;
            border-radius: 8px; cursor: pointer; transition: 0.2s;
        }
        .online-user-item:hover { background: rgba(255, 255, 255, 0.05); }
        
        .status-dot {
            width: 8px; height: 8px; background: #10b981; border-radius: 50%;
            box-shadow: 0 0 8px #10b981;
        }

        /* Overlays */
        .overlay-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 15, 0.85); backdrop-filter: blur(15px);
            z-index: 50; display: flex; align-items: center; justify-content: center;
        }
        .modal-box {
            background: rgba(0, 0, 0, 0.6); padding: 40px; border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1); text-align: center; max-width: 400px;
        }
    </style>
</head>
<body>

    <!-- VIP Liquid Backgrounds -->
    <div class="liquid-shape shape-1"></div>
    <div class="liquid-shape shape-2"></div>
    <div class="liquid-shape shape-3"></div>

    <!-- Original Navbar with Back Button -->
    <nav class="navbar glass">
        <div class="logo">Studio313</div>
        <ul class="nav-links" id="navLinks">
            <li><a href="index.html" style="color: #9ca3af;">← Back to Home</a></li>
            <li><a href="download.html">Apps</a></li>
            <li><a href="community.html" style="color: var(--shape3); font-weight: 700;">Global Hub</a></li>
            <li>
                <div class="custom-dropdown">
                    <button class="dropdown-btn glass-btn" onclick="toggleDropdown()">
                        <span id="dropdownBtnText">Dark Liquid</span> ▼
                    </button>
                    <div class="dropdown-content glass" id="themeDropdown">
                        <a href="#" onclick="setCustomTheme('dark', 'Dark Liquid')">Dark Liquid</a>
                        <a href="#" onclick="setCustomTheme('light', 'Light Glass')">Light Glass</a>
                        <a href="#" onclick="setCustomTheme('vip', 'VIP Gold')">VIP Gold</a>
                    </div>
                </div>
            </li>
        </ul>
    </nav>

    <div class="chat-container">
        
        <!-- Login Overlay -->
        <div id="authOverlay" class="overlay-screen">
            <div class="modal-box">
                <h2 style="color: #ffffff; margin-bottom: 10px;">Identity Verification</h2>
                <button id="loginBtn" class="glass-btn" style="width: 100%; padding: 15px; margin-top: 20px;">Connect Google ID</button>
            </div>
        </div>

        <!-- 1. Left Channels -->
        <div class="chat-sidebar">
            <div class="section-title">Rooms</div>
            <ul class="channel-list">
                <li class="channel-item active">General Lounge</li>
                <li class="channel-item">The Gulf Region</li>
            </ul>
            
            <!-- User Control -->
            <div style="margin-top: auto; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1);">
                <div style="font-size: 0.8rem; color: #fff; margin-bottom: 5px;" id="myUserName">Connecting...</div>
                <button id="logoutBtn" style="display:none; background:none; border:none; color:#ef4444; cursor:pointer; font-size:0.75rem; padding:0;">Disconnect</button>
            </div>
        </div>

        <!-- 2. Center Chat -->
        <div class="chat-main">
            <div class="chat-header">
                <div>
                    <h2 style="color: #fff; margin:0; font-size:1.1rem;">General Lounge</h2>
                </div>
            </div>
            
            <div class="chat-messages" id="chatMessages"></div>
            
            <div class="chat-input-area">
                <span title="Emojis" style="cursor:pointer; font-size:1.2rem;">😀</span>
                <input type="text" class="chat-input" id="messageInput" placeholder="Type a message...">
                <button class="glass-btn" id="sendBtn" style="padding: 10px 20px;">Send</button>
            </div>
        </div>

        <!-- 3. Right Sidebar (Yahoo Style Online Users Placeholder) -->
        <div class="online-sidebar">
            <div class="section-title">Online Users (3)</div>
            
            <!-- Dummy data for UI look, backend logic will be added next -->
            <div class="online-user-item">
                <div class="status-dot"></div>
                <div class="avatar" style="width: 30px; height: 30px; font-size: 0.7rem;">AD</div>
                <div style="font-size: 0.8rem; color: #fff;">Ali_Dev</div>
            </div>
            <div class="online-user-item">
                <div class="status-dot"></div>
                <div class="avatar" style="width: 30px; height: 30px; font-size: 0.7rem;">US</div>
                <div style="font-size: 0.8rem; color: #fff;">User99</div>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBb_IjN3EtsHuhMP8b5U6_xUEfYf80Gaoc",
            authDomain: "studio313-hq.firebaseapp.com",
            projectId: "studio313-hq",
            storageBucket: "studio313-hq.firebasestorage.app",
            messagingSenderId: "328116481829",
            appId: "1:328116481829:web:6cba13235e85ea76e174cc"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('authOverlay').style.display = 'none';
                document.getElementById('logoutBtn').style.display = 'block';
                document.getElementById('myUserName').innerText = user.displayName;
                loadMessages();
            } else {
                currentUser = null;
                document.getElementById('authOverlay').style.display = 'flex';
                document.getElementById('logoutBtn').style.display = 'none';
                document.getElementById('myUserName').innerText = "Connecting...";
            }
        });

        document.getElementById('loginBtn').addEventListener('click', () => signInWithPopup(auth, provider));
        document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        document.getElementById('messageInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        async function sendMessage() {
            const text = document.getElementById('messageInput').value.trim();
            if (text === "" || !currentUser) return;
            document.getElementById('messageInput').value = ""; 
            
            // Check if user is the dev based on current email
            let role = "Client";
            if(currentUser.email === "request.app313@gmail.com" || currentUser.email === "aapki_asli_email@gmail.com") {
                role = "Developer";
            }

            await addDoc(collection(db, "global_chat"), {
                text: text, uid: currentUser.uid, displayName: currentUser.displayName, 
                role: role, timestamp: serverTimestamp()
            });
        }

        function loadMessages() {
            const q = query(collection(db, "global_chat"), orderBy("timestamp", "asc"));
            onSnapshot(q, (snapshot) => {
                const chatContainer = document.getElementById('chatMessages');
                chatContainer.innerHTML = ""; 
                snapshot.forEach((doc) => {
                    const msg = doc.data();
                    const isOwn = msg.uid === currentUser.uid;
                    const badge = msg.role === "Developer" ? `<span class="role-badge badge-dev">Dev</span>` : "";
                    
                    chatContainer.innerHTML += `
                        <div class="message ${isOwn ? 'own' : ''}">
                            <div class="avatar" title="Click to view profile">${msg.displayName.substring(0,2).toUpperCase()}</div>
                            <div class="msg-content">
                                <div style="font-size:0.8rem; margin-bottom:4px; font-weight:600; color:#fff;">
                                    ${msg.displayName} ${badge}
                                </div>
                                ${msg.text}
                            </div>
                        </div>
                    `;
                });
                chatContainer.scrollTop = chatContainer.scrollHeight;
            });
        }
    </script>
</body>
</html>
